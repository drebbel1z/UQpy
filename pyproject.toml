[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "UQpy"
version = "4.2.1"
description = "UQpy is a general purpose toolbox for Uncertainty Quantification"
readme = "README.rst"
license = {file = "LICENSE"}
authors = [
    {name = "Michael D. Shields, Dimitris G. Giovanis, Audrey Olivier, Aakash Bangalore-Satish, Mohit Chauhan, Lohit Vandanapu, Ketson R.M. dos Santos"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Natural Language :: English",
]
requires-python = ">3.12.0"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "scikit-learn>=1.5.0",
    "fire>=0.6.0",
    "beartype>=0.18.5",
    "torch>=2.2.2",
    "torchinfo>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pylint>=3.1.0",
    "pytest-azurepipelines>=1.0.5",
    "wheel>=0.43.0",
    "twine>=5.0.0",
    "sphinx_autodoc_typehints>=1.23.0",
    "sphinx_rtd_theme>=1.2.0",
    "sphinx_gallery>=0.13.0",
    "sphinxcontrib_bibtex>=2.5.0",
    "Sphinx>=6.1.3",
    "hypothesis>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/SURGroup/UQpy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.pdf"]

[tool.pytest.ini_options]
log_cli = true

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["E402","E501","E712","E721","E722","E731","E741","F401","F403","F405","F541","F811","F841","I001","B007","B008","B009","B023","B024","B027","B904","S605","S301","S307","S101","S102"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"
docstring-code-format = true
